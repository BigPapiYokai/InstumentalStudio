[project]
name = "stemcraft"
version = "0.1.0"
description = "StemCraft Studio: All-in-one Instrumental Creator & Stem Separation Suite"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.10.0",
    "numpy>=2.0.0",
    "scipy>=1.13.0",
    "soundfile>=0.12.0",
    "sounddevice>=0.4.6",
    "librosa>=0.10.0",
    "demucs>=4.0.0",
    "onnxruntime>=1.17.0",
    "pydub>=0.25.1"
]

[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"
